services:
  - name: skatespot-backend
    type: web
    image:
      dockerfile: Dockerfile
    instance_type: nano
    min_scale: 1
    max_scale: 1
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    env:
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: myproject.settings

# 以下敏感变量请在 Koyeb 服务的 Environment variables 中添加为 Secret：
# DATABASE_URL / DJANGO_SECRET_KEY / ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS / CORS_ALLOWED_ORIGINS
